<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Particle Portrait</title>
    <meta name="description" content="Drop any photo and watch it become a swarm of text characters. Runs entirely in your browser.">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
<div class="app">
    <header class="top">
        <div class="brand">
            <h1>Particle Portrait</h1>
            <p>Drop any photo. It becomes a swarm of characters. Nothing leaves your browser.</p>
        </div>
        <div class="actions">
            <button id="choose" class="btn primary" type="button">Choose image</button>
            <input id="file" type="file" accept="image/*" hidden>
        </div>
    </header>

    <main class="stage">
        <figure class="panel">
            <figcaption>Original</figcaption>
            <div class="frame"><img id="original" alt="The original image you loaded"></div>
        </figure>
        <figure class="panel">
            <figcaption id="result-caption">Grayscale characters</figcaption>
            <div class="frame dark">
                <canvas id="scene" aria-label="The image redrawn from thousands of text characters."></canvas>
            </div>
        </figure>
    </main>

    <aside class="controls" aria-label="Settings">
        <fieldset class="group">
            <legend>Output</legend>
            <div class="seg" role="radiogroup" aria-label="Output color">
                <label><input type="radio" name="mode" value="grayscale" checked><span>Grayscale</span></label>
                <label><input type="radio" name="mode" value="color"><span>Color</span></label>
            </div>
        </fieldset>

        <fieldset class="group">
            <legend>Characters</legend>
            <label class="field">
                <span>Preset</span>
                <select id="preset"></select>
            </label>
            <label class="field">
                <span>Dark → light</span>
                <input id="characters" type="text" spellcheck="false" autocomplete="off" maxlength="100">
            </label>
        </fieldset>

        <fieldset class="group">
            <legend>Tuning</legend>
            <label class="field range"><span>Particles</span><output id="particleCount-out"></output>
                <input id="particleCount" type="range" min="5000" max="150000" step="1000"></label>
            <label class="field range"><span>Brightness</span><output id="brightness-out"></output>
                <input id="brightness" type="range" min="0.5" max="3" step="0.05"></label>
            <label class="field range"><span>Gamma</span><output id="gamma-out"></output>
                <input id="gamma" type="range" min="0.4" max="1.6" step="0.05"></label>
            <label class="field range"><span>Dark cutoff</span><output id="threshold-out"></output>
                <input id="threshold" type="range" min="0" max="0.3" step="0.005"></label>
            <label class="field range"><span>Glyph size</span><output id="glyphScale-out"></output>
                <input id="glyphScale" type="range" min="0.8" max="2" step="0.05"></label>
        </fieldset>

        <fieldset class="group">
            <legend>Export</legend>
            <div class="btnrow">
                <button id="replay" class="btn" type="button">Replay</button>
                <button id="save-png" class="btn" type="button">Save .png</button>
                <button id="copy-txt" class="btn" type="button">Copy text</button>
                <button id="save-txt" class="btn" type="button">Save .txt</button>
            </div>
        </fieldset>
    </aside>
</div>

<div id="drop" aria-hidden="true"><p>Drop an image to convert it</p></div>
<p id="toast" role="status" aria-live="polite"></p>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
